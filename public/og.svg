<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: #111111; }
      .cream { fill: #f5f1e8; }
      .hot { fill: #ff5a3c; }
      .muted { fill: #9a948a; }
      .electric { fill: #7df9c9; }
      .wordmark {
        font-family: 'Bricolage Grotesque', 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .tagline {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .mono {
        font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
        letter-spacing: 0.18em;
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>

  <rect x="80" y="80" width="14" height="14" class="electric"/>
  <text x="110" y="94" class="mono cream" font-size="18">FOUNDING.ENGINEER</text>

  <text x="80" y="280" class="wordmark cream" font-size="120">ZIDDAN/</text>
  <text x="80" y="410" class="wordmark hot" font-size="120">WORKSHOP</text>

  <line x1="80" y1="470" x2="200" y2="470" stroke="#f5f1e8" stroke-width="2"/>

  <text x="80" y="525" class="tagline cream" font-size="32">Founding engineer for founders</text>
  <text x="80" y="565" class="tagline cream" font-size="32">without a tech team.</text>

  <text x="80" y="592" class="mono muted" font-size="14">4 YEARS · 15+ SHIPPED · WEB · MOBILE · BACKEND · INFRA</text>
</svg>
